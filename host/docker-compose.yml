version: "3.8"

services:
  vault:
    image: python:3.12-alpine
    container_name: akademia-vault
    restart: unless-stopped
    mem_limit: 128m
    working_dir: /app
    volumes:
      - ..:/app/static:ro
      - ../data:/app/data
      - ./progress_vault.py:/app/progress_vault.py:ro
      - ./hermes_router.py:/app/hermes_router.py:ro
    environment:
      ACADEMY_BIND: 0.0.0.0
      ACADEMY_PORT: 8097
      ACADEMY_STATIC_ROOT: /app/static
      ACADEMY_DATA_DIR: /app/data
      ACADEMY_PROGRESS_TOKEN: ${ACADEMY_PROGRESS_TOKEN:-}
      ACADEMY_VAPID_PUBLIC_KEY: ${ACADEMY_VAPID_PUBLIC_KEY:-}
      ACADEMY_PUSH_MAX_SUBS: ${ACADEMY_PUSH_MAX_SUBS:-10}
      # Hermes (mózg LLM). Wartości żyją w /opt/akademia/.env (chmod 600, poza repo).
      # Bez tego przekazania kod CZYTA zmienne, których kontener nie ma — i Hermes
      # po cichu odpowiada silnikiem lokalnym, mimo poprawnie wpisanego klucza.
      ACADEMY_HERMES_BASE_URL: ${ACADEMY_HERMES_BASE_URL:-}
      ACADEMY_HERMES_MODEL: ${ACADEMY_HERMES_MODEL:-}
      ACADEMY_HERMES_API_KEY: ${ACADEMY_HERMES_API_KEY:-}
      ACADEMY_HERMES_MAX_TOKENS: ${ACADEMY_HERMES_MAX_TOKENS:-}
      ACADEMY_HERMES_TIMEOUT: ${ACADEMY_HERMES_TIMEOUT:-}
      ACADEMY_HERMES_DAILY_CAP: ${ACADEMY_HERMES_DAILY_CAP:-}
    command: ["python", "/app/progress_vault.py"]
    ports:
      - "127.0.0.1:8097:8097"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8097/health"]
      interval: 30s
      timeout: 5s
      retries: 3
