# Pre-TLS bootstrap — certbot --nginx adds SSL blocks.
server {
    listen 80;
    server_name akademia.quietforge.flexgrafik.nl;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    add_header X-Frame-Options "DENY" always;

    auth_basic "Akademia OS";
    auth_basic_user_file /opt/akademia/host/.htpasswd;

    error_page 401 =401 /auth-gate.html;
    location = /auth-gate.html {
        auth_basic off;
        alias /opt/akademia/host/auth-gate.html;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
