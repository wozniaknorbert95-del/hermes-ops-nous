# akademia.quietforge.flexgrafik.nl — proxy to vault :8097 (TLS via certbot).
# X-Frame-Options DENY — Akademia nie wchodzi w iframe Kokpitu.
#
# WYJĄTEK OD BASIC AUTH: manifest i ikony (poniżej).
# Powód (2026-09-20, zgłoszenie Dowódcy: „na telefonie da się tylko utworzyć skrót"):
# Chromium pobiera manifest BEZ poświadczeń, więc za Basic Auth dostawał 401 i nie
# uznawał witryny za instalowalną, a ikon nie da się pobrać z poświadczeniami wcale
# — Android nie mógł zmintować WebAPK i menu proponowało wyłącznie „Utwórz skrót".
# Chromium nie cache'uje tej decyzji na stałe, ale liczy ją przy każdym wejściu.
# Źródła: MDN „Deploying a manifest" (crossorigin=use-credentials),
#         kopia/kopia#5376 (manifest 401 pod Basic Auth),
#         mealie-recipes/mealie#6060 (Android Chrome: brak „Install", sam „Create shortcut").
# Te pliki nie zawierają sekretów: nazwa aplikacji, kolory, ikony, start_url.
# HTML, /progress i /push/* zostają ZA hasłem — odsłaniamy tylko to, co niezbędne.

server {
    listen 80;
    server_name akademia.quietforge.flexgrafik.nl;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name akademia.quietforge.flexgrafik.nl;

    ssl_certificate /etc/letsencrypt/live/akademia.quietforge.flexgrafik.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akademia.quietforge.flexgrafik.nl/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- PUBLICZNE: manifest (bez Basic Auth) ---------------------------------
    location = /manifest.webmanifest {
        auth_basic off;
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location = /manifest-ops.webmanifest {
        auth_basic off;
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # --- PUBLICZNE: ikony (bez Basic Auth) ------------------------------------
    # Ikony MUSZĄ być anonimowe: przeglądarka nie wysyła do nich poświadczeń,
    # a serwer mintujący WebAPK pobiera je z zewnątrz.
    location ^~ /icons/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    auth_basic "Akademia OS";
    auth_basic_user_file /opt/akademia/host/.htpasswd;

    error_page 401 =401 /auth-gate.html;
    location = /auth-gate.html {
        auth_basic off;
        alias /opt/akademia/host/auth-gate.html;
        default_type text/html;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
