# akademia.quietforge.flexgrafik.nl — proxy to vault :8097 (TLS via certbot).
# X-Frame-Options DENY — Akademia nie wchodzi w iframe Kokpitu.

server {
    listen 80;
    server_name akademia.quietforge.flexgrafik.nl;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name akademia.quietforge.flexgrafik.nl;

    ssl_certificate /etc/letsencrypt/live/akademia.quietforge.flexgrafik.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akademia.quietforge.flexgrafik.nl/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    auth_basic "Akademia OS";
    auth_basic_user_file /opt/akademia/host/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
