# --- ZASADY URUCHAMIANIA PIPELINE --------------------------------------
# Domyślnie: pipeline dla MR-ów i dla main (zabezpieczenie po merge).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
