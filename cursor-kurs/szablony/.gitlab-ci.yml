# =====================================================================
# .gitlab-ci.yml — szkielet CI: strażnik jakości dla MR-ów (lepiej: każda
# komenda musi być TĄ SAMĄ, którą ma agent w AGENTS.md sekcji "Komendy").
# Dostosuj do stacku. Dla GitHuba: przenieś logikę do .github/workflows/*.yml
# =====================================================================

stages:
  - validate
  - test
  - build

# Cache pnpm — przyspiesza pipeline
.default-cache: &default-cache
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pnpm-store

install-deps:
  stage: validate
  image: node:20
  interruptible: true
  cache: *default-cache
  script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
      - .pnpm-store
    expire_in: 1 hour

lint:
  stage: validate
  image: node:20
  needs: [install-deps]
  interruptible: true
  cache: *default-cache
  script:
    - corepack enable
    - pnpm lint

typecheck:
  stage: validate
  image: node:20
  needs: [install-deps]
  interruptible: true
  cache: *default-cache
  script:
    - corepack enable
    - pnpm typecheck

unit-tests:
  stage: test
  image: node:20
  needs: [install-deps]
  interruptible: true
  cache: *default-cache
  script:
    - corepack enable
    - pnpm test -- --reporter=junit --outputFile=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml

build:
  stage: build
  image: node:20
  needs: [install-deps]
  cache: *default-cache
  script:
    - corepack enable
    - pnpm build
  artifacts:
    paths:
      - dist/
      - .next/
    expire_in: 1 day

