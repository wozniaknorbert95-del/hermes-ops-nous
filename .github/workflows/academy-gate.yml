name: academy-gate

# WYZWALACZ dla regul, ktore dotad istnialy tylko w pamieci Dowodcy.
#
# Zmierzone 2026-09-20: repo mialo 0 workflow, `main` bez ochrony, a walidator i testy
# mutacyjne (najmocniejszy asset tego repo) odpalaly sie WYLACZNIE wtedy, gdy czlowiek
# o nich pamietal. Reguly byly dobre — nie mialy czym byc wymuszone.
#
# Ten workflow uruchamia DOKLADNIE komende z AGENTS.md sekcja "Komendy projektu":
#   python scripts/validate-academy-export.py && python scripts/test_progress_vault.py
#
# SWIADOMIE BEZ filtra `paths:` i bez `if: changed == 'true'`. W `workflow-lab` istnieje
# wzorzec falszywej zieleni: docs-only PR dostaje SUCCESS z joba, ktory nie wykonal
# zadnego kroku, a automerge go scala. Tutaj kazdy push placi pelny koszt.

on:
  # Prywatne ubuntu-latest spala płatne minuty. Bramka = laptop:
  #   bash scripts/deploy-ready-hermes-ops.sh
  # Ręczne odpalenie (self-hosted / gdy wrócą minuty): Actions → Run workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  academy-gate:
    name: academy-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrakt eksportu + dashboard (AGENTS.md pkt 2)
        run: python scripts/validate-academy-export.py
      - name: Testy vaulta (AGENTS.md sekcja Komendy)
        run: python scripts/test_progress_vault.py
      - name: Router intent Hermes (B2)
        run: python scripts/test_hermes_intent.py
      - name: Hermes eval bez LLM (--digest-only)
        run: python scripts/hermes-eval.py --digest-only
      # ZMIERZONE 2026-09-20: bez tego kroku CI przechodzilo w 6 s, nie uruchamiajac
      # testow mutacyjnych — a to one sa jedynym dowodem, ze guardy lapia regresje.
      # Lista JAWNA (nie glob w bashu), bo guard Fala J w walidatorze wymaga, by kazdy
      # plik scripts/mutation-test-*.py byl tu wymieniony: nowy zestaw = ten sam PR.
      - name: Mutation testy — czy guardy w ogole lapia regresje
        run: |
          python scripts/mutation-test-fala-0.py
          python scripts/mutation-test-fala-d.py
          python scripts/mutation-test-fala-e.py
          python scripts/mutation-test-fala-i.py
          python scripts/mutation-test-fala-j.py
          python scripts/mutation-test-fala-k.py
          python scripts/mutation-test-fala-l.py
          python scripts/mutation-test-fala-m.py
          python scripts/mutation-test-fala-n.py
          python scripts/mutation-test-fala-o.py
          python scripts/mutation-test-fala-p.py
          python scripts/mutation-test-fala-q.py
          python scripts/mutation-test-fala-r.py
          python scripts/mutation-test-fala-s.py
